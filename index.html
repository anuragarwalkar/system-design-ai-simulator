<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="SystemFlow — High-Performance 60FPS Interactive System Design Simulator powered by WebAssembly, HTML5 Canvas, and AI" />
  <meta name="theme-color" content="#0D0F17" />
  <title>SystemFlow — Interactive System Design Simulator</title>

  <!-- PWA & Mobile Web Capabilities -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SystemFlow" />
  <meta name="application-name" content="SystemFlow" />
  <meta name="msapplication-TileColor" content="#0D0F17" />
  <meta name="msapplication-TileImage" content="./icons/systemflow-192.png" />

  <!-- Favicons and Touch Icons -->
  <link rel="icon" type="image/svg+xml" href="./icons/systemflow-icon.svg?v=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/systemflow-32.png?v=1.0" />
  <link rel="icon" type="image/png" sizes="16x16" href="./icons/systemflow-16.png?v=1.0" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/systemflow-apple-touch.png?v=1.0" />
  <link rel="shortcut icon" href="./favicon.ico?v=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./src/styles/index.css" />
  <link rel="stylesheet" href="./src/styles/layout.css" />
  <link rel="stylesheet" href="./src/styles/components.css" />
  <link rel="stylesheet" href="./src/styles/config-panel.css" />
  <link rel="stylesheet" href="./src/styles/ai-panel.css" />
  <link rel="stylesheet" href="./src/styles/animations.css" />
</head>
<body>
  <div class="app-root">
    <!-- Top Action Toolbar -->
    <header class="app-header" id="app-header"></header>

    <!-- Main Workspace -->
    <main class="app-workspace">
      <!-- Left Sidebar: Component Palette & Interview Scenarios -->
      <aside class="app-sidebar" id="app-sidebar"></aside>

      <!-- Sidebar Drag Resizer Handle -->
      <div class="sidebar-resizer" id="sidebar-resizer" title="Drag to resize sidebar • Double-click to reset"></div>

      <!-- Central Canvas Viewport -->
      <section class="canvas-container" id="canvas-container">
        <!-- Floating Show-Sidebar Tab when sidebar is hidden -->
        <button id="btn-expand-sidebar" class="canvas-floating-sidebar-toggle" title="Show Components Sidebar (Ctrl+[)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
            <polyline points="13 10 15 12 13 14"/>
          </svg>
          <span>Components</span>
        </button>

        <canvas class="sim-canvas" id="sim-canvas"></canvas>

        <!-- Top-floating Telemetry HUD -->
        <div class="floating-metrics-hud" id="metrics-hud"></div>
      </section>

      <!-- Right Sidebar: Selected Node Inspector -->
      <aside class="app-inspector" id="app-inspector"></aside>
    </main>

    <!-- Mobile Drawer Backdrops -->
    <div class="mobile-drawer-backdrop" id="sidebar-backdrop"></div>
    <div class="mobile-drawer-backdrop" id="inspector-backdrop"></div>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="mobile-bottom-nav" id="mobile-nav"></nav>

    <!-- Slide-over Panels -->
    <div id="ai-panel-container"></div>
    <div id="eval-panel-container"></div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
