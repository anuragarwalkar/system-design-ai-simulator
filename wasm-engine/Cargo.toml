[package]
name = "wasm-engine"
version = "0.1.0"
authors = ["System Design Simulator Team"]
edition = "2021"
description = "High-performance discrete-event system design simulator and graph analysis engine compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
# Tell `rustc` to optimize for small code size and fast execution speed
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
